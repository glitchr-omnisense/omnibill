# omnisense/omnibill with every gateway package:
#
#   cp .env.dist .env                                          # a mailer, a platform's credentials, PISTE's, when you have them
#   docker compose run --rm omnibill gateways                  # which gateways are installed and configured, what each carries and does
#   docker compose run --rm omnibill bare --live               # the e-mail sent for real through MAILER_DSN
#   docker compose run --rm omnibill bare                      # plain PHP: no bundle, no container, the platforms' recorded answers, and what PHP loaded
#   docker compose run --rm omnibill test                      # every package's tests
#
# Gateways come from GitHub (branch 1.x) unless their checkout sits under
# OMNIBILL_PLUGINS (set it to ../.. in .env when this core sits in the
# workspace beside them): then that checkout is what runs.
# omnisense/contracts likewise: its checkout under OMNISENSE_CONTRACTS (../../../omnisense-contracts
# in .env when it sits beside the family's folder), its tests run with the family's; GitHub otherwise.
name: omnibill-harness

services:
  omnibill:
    build: .
    image: omnisense/omnibill-harness
    # The image may be another family's harness tagged (the same PHP 8.4 Alpine with Composer): the
    # entrypoint is named here, not taken from the image.
    entrypoint: ["/omnibill/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnibill/core
      - ${OMNIBILL_PLUGINS:-./plugins}:/omnibill/plugins:ro
      - ${OMNISENSE_CONTRACTS:-./contracts}:/omnisense/contracts:ro
      - harness:/harness

volumes:
  harness:
